workflows:
  ios-build:
    name: iOS Build & Publish
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eduval.moments
      vars:
        XCODE_PROJECT: "JoieLibreMoments.xcodeproj"
        XCODE_SCHEME: "JoieLibreMoments"
      xcode: latest
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
