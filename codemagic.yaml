workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Key
    environment:
      vars:
        XCODE_PROJECT: "Love.xcodeproj"
        XCODE_SCHEME: "J&M Joie Libre Moments"
      xcode: latest
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles --profile-type ad_hoc
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
